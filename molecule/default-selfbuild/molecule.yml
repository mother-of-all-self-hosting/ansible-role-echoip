---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: echoip-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        echoip_debug_service_enabled: false

        # Names the helper containers that verify.yml starts, so that the
        # scenarios never collide on a container name.
        echoip_molecule_scenario: default-selfbuild

        # The port on the host that echoip is published on. verify.yml reaches
        # it there to check that publishing actually took effect.
        echoip_molecule_http_bind_port: 8080

        # Variables for echoip
        echoip_uid: 1000
        echoip_gid: 1000
        echoip_hostname: localhost
        echoip_container_labels_traefik_enabled: false
        echoip_container_http_host_bind_port: "127.0.0.1:{{ echoip_molecule_http_bind_port }}"

        # Test self-building
        echoip_container_image_self_build: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
