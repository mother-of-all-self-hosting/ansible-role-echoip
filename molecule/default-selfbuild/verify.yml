---
- name: Verify echoip
  hosts: all
  become: true
  gather_facts: false

  vars:
    # An address that cannot be anyone's real source address here, so that
    # seeing it come back can only mean the header carrying it was trusted.
    # From the TEST-NET-3 range reserved for documentation (RFC 5737).
    echoip_verify_spoofed_address: 203.0.113.45

    # A second reserved address, sent in a header the role does not configure
    # echoip to trust.
    echoip_verify_untrusted_address: 198.51.100.7

    # The header the role's systemd unit passes to echoip via `-H`.
    echoip_verify_trusted_header: X-Real-IP

    # A copy of the role's container image, run without the `-H` flag that the
    # role passes. It is the negative control for every assertion below: it
    # tells "echoip behaves this way" apart from "the role configured echoip
    # to behave this way".
    echoip_verify_control_container_name: "echoip-molecule-{{ echoip_molecule_scenario }}-unconfigured"

    # The throwaway container the probes are issued from. It has to sit on
    # echoip's own container network rather than reach in from the host:
    # since Docker 28 the host gateway is not a usable path to a container on
    # a user-defined bridge network, and going through it would also make the
    # source address a gateway address rather than a client's own.
    echoip_verify_probe_container_name: "echoip-molecule-{{ echoip_molecule_scenario }}-probe"
    echoip_verify_probe_container_image: docker.io/library/python:3-alpine

    # Issues one HTTP request and reports both what came back and the address
    # the request went out from, which is the whole point: echoip's answer is
    # only meaningful when compared against the address of whoever asked.
    #
    # Written against the socket rather than an HTTP client library so that
    # the source address is read off the very connection the request
    # travelled on, instead of being inferred or assumed.
    echoip_verify_probe_script: |
      import json
      import socket
      import sys

      host = sys.argv[1]
      port = int(sys.argv[2])
      path = sys.argv[3]
      headers = sys.argv[4:]

      connection = socket.create_connection((host, port), timeout=10)

      # The address this connection actually leaves from, which is what echoip
      # sees as the client address. Asking the socket, rather than assuming,
      # keeps the assertions independent of how Docker numbers its networks.
      source = connection.getsockname()[0]

      request = "GET " + path + " HTTP/1.1\r\n"
      request += "Host: " + host + "\r\n"
      request += "Connection: close\r\n"
      # echoip decides between an HTML page and a bare address by looking at
      # the User-Agent. Asking as a command line client keeps the response to
      # the address itself.
      request += "User-Agent: curl/8.5.0\r\n"

      for header in headers:
          name, _, value = header.partition(":")
          request += name + ": " + value + "\r\n"

      request += "\r\n"

      connection.sendall(request.encode())

      response = b""

      while True:
          chunk = connection.recv(65536)
          if not chunk:
              break
          response += chunk

      connection.close()

      head, _, body = response.partition(b"\r\n\r\n")

      print(json.dumps({
          "source": source,
          "status": int(head.split(b"\r\n")[0].split(b" ")[1]),
          "body": body.decode("utf-8", "replace").strip(),
      }))

  tasks:
    - name: Run the shared echoip verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
