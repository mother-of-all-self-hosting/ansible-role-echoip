---
# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: echoip_defaults

- name: Wait for echoip service to become active (up to 180s)
  ansible.builtin.systemd:
    name: echoip.service
  register: echoip_service
  until: echoip_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert echoip service is active
  ansible.builtin.assert:
    that: echoip_service.status.ActiveState == 'active'
    fail_msg: "echoip.service not active ({{ echoip_service.status.ActiveState }})"
    success_msg: "echoip.service is active"

- name: Retrieve echoip service log for debugging
  when: echoip_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu echoip.service
  changed_when: false

# Everything the rest of this playbook needs about how the container was
# actually created: the image, the network it joined, and the arguments
# the systemd unit handed the binary. Taken from the container itself
# rather than from role defaults, because the defaults for those are Jinja
# expressions, and because a negative control is only a control if it runs
# the very same image.
#
# Inspected without `--format`, so that the whole document comes back as
# JSON and is parsed once, instead of shelling out per field through Go
# template syntax that Ansible would also want to interpret.
- name: Inspect the echoip container
  ansible.builtin.command:
    cmd: "docker container inspect {{ echoip_defaults.echoip_identifier }}"
  register: echoip_container_inspection
  changed_when: false

- name: Establish what the echoip container was created from
  ansible.builtin.set_fact:
    echoip_container: "{{ (echoip_container_inspection.stdout | from_json)[0] }}"

- name: Establish the echoip container image and network
  ansible.builtin.set_fact:
    echoip_verify_image: "{{ echoip_container.Config.Image }}"
    echoip_verify_network: "{{ echoip_container.NetworkSettings.Networks.keys() | list | first }}"

# The systemd unit is what the role renders, and `-H X-Real-IP` in it is
# the only reason echoip trusts that header at all. Asserting it here ties
# the behavior probed further down to the file the role wrote, rather than
# to a default of echoip's own.
- name: Read the echoip systemd unit the role rendered
  ansible.builtin.slurp:
    src: /etc/systemd/system/echoip.service
  register: echoip_systemd_unit

- name: Assert the rendered systemd unit passes the trusted header flag
  vars:
    echoip_verify_unit_contents: "{{ echoip_systemd_unit.content | b64decode }}"
  ansible.builtin.assert:
    that: "'-H ' ~ echoip_verify_trusted_header in echoip_verify_unit_contents"
    fail_msg: "The rendered unit does not pass -H {{ echoip_verify_trusted_header }}"
    success_msg: "The rendered unit passes -H {{ echoip_verify_trusted_header }}"

# ... and the process really was started with it. Between the assertion
# above and this one, the flag is followed from the file the role wrote to
# the arguments the container is running with.
- name: Assert the echoip container is running with the trusted header flag
  vars:
    echoip_verify_args: "{{ echoip_container.Args | default([]) }}"
  ansible.builtin.assert:
    that:
      - "'-H' in echoip_verify_args"
      - echoip_verify_trusted_header in echoip_verify_args
    fail_msg: "The container is running with unexpected arguments: {{ echoip_container.Args | default([]) }}"
    success_msg: "The container is running with -H {{ echoip_verify_trusted_header }}"

- name: Ensure the probe container image is pulled
  ansible.builtin.command:
    cmd: "docker pull {{ echoip_verify_probe_container_image }}"
  register: echoip_probe_image_pull
  changed_when: "'Downloaded newer image' in echoip_probe_image_pull.stdout"
  retries: 5
  delay: 10
  until: echoip_probe_image_pull is not failed

# ---------------------------------------------------------------------
# The negative control, established before anything the role configured
# ---------------------------------------------------------------------
#
# The same image the role runs, started without the role's `-H` flag and
# without anything else the role sets. Whatever this instance does is what
# echoip does by itself; only what the role's instance does differently
# can be credited to the role.
#
# Started through the docker CLI rather than community.docker.*, because
# the ansible-lint environment used by pre-commit does not have the
# community.docker collection and would fail the syntax check.
- name: Start an unconfigured echoip container as a negative control
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --rm
      - "--name={{ echoip_verify_control_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_image }}"
  changed_when: true

- name: Ask the unconfigured echoip for the caller address (up to 60s)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_verify_control_container_name }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /
  register: echoip_control_plain
  changed_when: false
  until: echoip_control_plain is not failed and (echoip_control_plain.stdout | from_json).status == 200
  retries: 12
  delay: 5

- name: Assert the unconfigured echoip echoes the caller its own address
  vars:
    echoip_verify_result: "{{ echoip_control_plain.stdout | from_json }}"
  ansible.builtin.assert:
    that: echoip_verify_result.body == echoip_verify_result.source
    fail_msg: "Asked from {{ echoip_verify_result.source }}, the image answered {{ echoip_verify_result.body }}"
    success_msg: "The image echoes the caller its own address ({{ echoip_verify_result.source }})"

- name: Ask the unconfigured echoip while claiming another address
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_verify_control_container_name }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /
      - "{{ echoip_verify_trusted_header }}:{{ echoip_verify_spoofed_address }}"
  register: echoip_control_spoofed
  changed_when: false

# The other half of the pair: unconfigured, echoip ignores the header
# outright. Without this, the role's instance honoring it would prove
# nothing about the role - echoip might simply have trusted it all along.
- name: Assert the unconfigured echoip ignores the header it was not told to trust
  vars:
    echoip_verify_result: "{{ echoip_control_spoofed.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - echoip_verify_result.body == echoip_verify_result.source
      - echoip_verify_result.body != echoip_verify_spoofed_address
    fail_msg: "The unconfigured image honored {{ echoip_verify_trusted_header }} and answered {{ echoip_verify_result.body }}"
    success_msg: "The unconfigured image ignores {{ echoip_verify_trusted_header }}, as it should"

# ---------------------------------------------------------------------
# The instance the role installed
# ---------------------------------------------------------------------

- name: Ask the role's echoip for the caller address (up to 60s)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_defaults.echoip_identifier }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /
  register: echoip_plain
  changed_when: false
  until: echoip_plain is not failed and (echoip_plain.stdout | from_json).status == 200
  retries: 12
  delay: 5

# What this role exists to do. The answer is checked against the address
# the asking container actually spoke from, so an echoip that echoed a
# fixed string, a gateway address, or its own address would fail here.
- name: Assert the role's echoip echoes the caller its own address
  vars:
    echoip_verify_result: "{{ echoip_plain.stdout | from_json }}"
  ansible.builtin.assert:
    that: echoip_verify_result.body == echoip_verify_result.source
    fail_msg: "Asked from {{ echoip_verify_result.source }}, echoip answered {{ echoip_verify_result.body }}"
    success_msg: "echoip echoes the caller its own address ({{ echoip_verify_result.source }})"

- name: Ask the role's echoip for the structured answer
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_defaults.echoip_identifier }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /json
  register: echoip_json
  changed_when: false

- name: Assert the structured answer reports the same address
  vars:
    echoip_verify_result: "{{ echoip_json.stdout | from_json }}"
    echoip_verify_payload: "{{ (echoip_json.stdout | from_json).body | from_json }}"
  ansible.builtin.assert:
    that: echoip_verify_payload.ip == echoip_verify_result.source
    fail_msg: "Asked from {{ echoip_verify_result.source }}, /json reported {{ echoip_verify_payload.ip | default('nothing') }}"
    success_msg: "/json reports the caller its own address ({{ echoip_verify_payload.ip }})"

- name: Ask the role's echoip while claiming another address
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_defaults.echoip_identifier }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /
      - "{{ echoip_verify_trusted_header }}:{{ echoip_verify_spoofed_address }}"
  register: echoip_spoofed
  changed_when: false

# The flag reaching the process, observed from the outside. The negative
# control above answered its caller's own address for this very request;
# this instance answers the header instead, and the only difference
# between them is the `-H` the role's systemd unit passes.
- name: Assert the role's echoip honors the header the role told it to trust
  vars:
    echoip_verify_result: "{{ echoip_spoofed.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - echoip_verify_result.body == echoip_verify_spoofed_address
      - echoip_verify_result.body != echoip_verify_result.source
    fail_msg: "echoip answered {{ echoip_verify_result.body }} instead of the {{ echoip_verify_trusted_header }} it was told to trust"
    success_msg: "echoip honors {{ echoip_verify_trusted_header }} ({{ echoip_verify_result.body }})"

- name: Ask the role's echoip while claiming an address in an untrusted header
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "--name={{ echoip_verify_probe_container_name }}"
      - "--network={{ echoip_verify_network }}"
      - "{{ echoip_verify_probe_container_image }}"
      - python3
      - -c
      - "{{ echoip_verify_probe_script }}"
      - "{{ echoip_defaults.echoip_identifier }}"
      - "{{ echoip_defaults.echoip_container_http_port }}"
      - /
      - "X-Forwarded-For:{{ echoip_verify_untrusted_address }}"
  register: echoip_untrusted
  changed_when: false

# The role trusts exactly one header, so the reach of its configuration
# has an edge: a header it did not name is ignored even though echoip is
# perfectly capable of trusting one.
- name: Assert the role's echoip ignores a header it was not told to trust
  vars:
    echoip_verify_result: "{{ echoip_untrusted.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - echoip_verify_result.body == echoip_verify_result.source
      - echoip_verify_result.body != echoip_verify_untrusted_address
    fail_msg: "echoip honored X-Forwarded-For and answered {{ echoip_verify_result.body }}"
    success_msg: "echoip ignores X-Forwarded-For, which the role does not trust"

# A second setting followed from configuration to observable behavior:
# `echoip_container_http_host_bind_port` is what puts a `-p` into the
# systemd unit, and reaching echoip on the host is the proof it took.
- name: Reach echoip on the port the scenario asked it to be published on
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ echoip_molecule_http_bind_port }}/json"
    method: GET
    return_content: true
  register: echoip_published
  until: echoip_published.status == 200
  retries: 12
  delay: 5

- name: Assert echoip answers on the published host port
  ansible.builtin.assert:
    that:
      - echoip_published.status == 200
      - echoip_published.json.ip | default('') | length > 0
    fail_msg: "echoip did not answer on the published port ({{ echoip_published.status | default('no response') }})"
    success_msg: "echoip answers on the published host port with {{ echoip_published.json.ip }}"

# There is deliberately no assertion that the running echoip is the
# version this role installs, the way the other roles of this fleet make
# one. echoip has no version to assert: the binary takes no `-version`
# flag (it rejects one), the image carries no labels, no endpoint reports
# one, upstream publishes no releases or git tags, and the only Docker tag
# that exists is `latest`. Asserting anything version-shaped here would be
# inventing a fact rather than checking one.

- name: Stop the negative control container
  ansible.builtin.command:
    cmd: "docker rm --force {{ echoip_verify_control_container_name }}"
  changed_when: true

- name: Show the echoip verification summary
  ansible.builtin.debug:
    msg:
      - "echoip systemd: {{ echoip_service.status.ActiveState }}"
      - "echoip image: {{ echoip_verify_image }}"
      - "echoip arguments: {{ echoip_container.Args | default([]) | join(' ') }}"
      - "Caller address echoed back: {{ (echoip_plain.stdout | from_json).body }}"
      - "Unconfigured image, {{ echoip_verify_trusted_header }} sent: {{ (echoip_control_spoofed.stdout | from_json).body }} (ignored)"
      - "Role's instance, {{ echoip_verify_trusted_header }} sent: {{ (echoip_spoofed.stdout | from_json).body }} (honored)"
      - "Role's instance, X-Forwarded-For sent: {{ (echoip_untrusted.stdout | from_json).body }} (ignored)"
      - "Published host port: {{ echoip_published.status }}"
